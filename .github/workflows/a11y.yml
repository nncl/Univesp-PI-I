name: Accessibility tests

# Runs the Cypress + axe suite (WCAG 2.1 AA) against a production build of the
# frontend backed by a real Django API and seeded MySQL. Called by deploy.yml so
# a failure blocks the deploy, and also runs on PRs to main for early feedback.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  a11y:
    name: Accessibility tests (Cypress + axe)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpwd
          MYSQL_DATABASE: tattoo_a11y
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-a11y-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_NAME: tattoo_a11y
      DATABASE_USER: root
      DATABASE_PASSWORD: rootpwd
      DJANGO_ADMIN_USERNAME: yara
      DJANGO_ADMIN_PASSWORD: ci-a11y-password
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      INTERNAL_API_BASE_URL: http://localhost:8000/api
      CYPRESS_adminUsername: yara
      CYPRESS_adminPassword: ci-a11y-password
      CYPRESS_apiUrl: http://localhost:8000/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL client headers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpwd --silent; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never came up"; exit 1

      - name: Migrate, create admin and seed portfolio
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py create_admin
          python manage.py seed_portfolio

      - name: Start backend
        working-directory: backend
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 \
            --daemon --access-logfile ../gunicorn.log --error-logfile ../gunicorn.log
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/portfolio/ > /dev/null; then
              echo "Backend ready"; exit 0
            fi
            sleep 1
          done
          echo "Backend never came up"; cat ../gunicorn.log; exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run accessibility tests
        working-directory: frontend
        run: npm run test:a11y:ci

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Backend log
        if: failure()
        run: cat gunicorn.log || true
