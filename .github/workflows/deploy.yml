name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: yara-tattoo-rg
  CONTAINER_APP_BACKEND: yara-tattoo-backend
  CONTAINER_APP_FRONTEND: yara-tattoo-frontend
  IMAGE_BACKEND: yara-tattoo-backend
  IMAGE_FRONTEND: yara-tattoo-frontend

# id-token: write is needed both for GitHub OIDC to mint a token Azure AD will
# trust, and for pushing to this repo's own GitHub Container Registry.
permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpwd
          MYSQL_DATABASE: tattoo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL client headers
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config build-essential

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -prootpwd --silent; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL never came up"; exit 1

      - name: Django check + tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-key
          DJANGO_DEBUG: "false"
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "3306"
          DATABASE_NAME: tattoo_test
          DATABASE_USER: root
          DATABASE_PASSWORD: rootpwd
        run: |
          python manage.py check
          python manage.py test --noinput

  deploy-backend:
    name: Build & deploy backend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner (GHCR requires it)
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_BACKEND }}
        run: |
          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            ./backend
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App (backend)
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_BACKEND }}
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name "${CONTAINER_APP_BACKEND}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${IMAGE}:${{ github.sha }}"

  deploy-frontend:
    name: Build & deploy frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image owner (GHCR requires it)
        run: echo "GHCR_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_FRONTEND }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          docker build \
            --target prod \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${NEXT_PUBLIC_GA_MEASUREMENT_ID}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            ./frontend
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App (frontend)
        env:
          IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/${{ env.IMAGE_FRONTEND }}
        run: |
          az extension add --name containerapp --upgrade -y
          az containerapp update \
            --name "${CONTAINER_APP_FRONTEND}" \
            --resource-group "${RESOURCE_GROUP}" \
            --image "${IMAGE}:${{ github.sha }}"
